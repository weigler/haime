<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haimë</title>
<meta name="theme-color" content="#141A1F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">§</span>
      <h1>Haimë</h1>
      <p class="brand-sub">um caderno de hábitos, só seu</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-tab="signin">Entrar</button>
      <button class="auth-tab" data-tab="signup">Criar conta</button>
    </div>

    <form id="signin-form" class="auth-form">
      <label>E-mail
        <input type="email" id="signin-email" required autocomplete="email">
      </label>
      <label>Senha
        <input type="password" id="signin-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <form id="signup-form" class="auth-form is-hidden">
      <label>Nome
        <input type="text" id="signup-name" required autocomplete="name">
      </label>
      <label>E-mail
        <input type="email" id="signup-email" required autocomplete="email">
      </label>
      <label>Senha
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
      </label>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>

    <div class="auth-divider"><span>ou</span></div>

    <button id="google-signin" class="btn btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continuar com Google
    </button>

    <p id="auth-error" class="auth-error"></p>
  </div>
</section>

<!-- ===== APP ===== -->
<section id="app-screen" class="app-screen is-hidden">

  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">§</span>
      <span class="topbar-title">Haimë</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-new-habit" class="btn btn-accent btn-sm">+ Hábito</button>
      <button id="btn-user-menu" class="user-chip">
        <span id="user-initial">?</span>
      </button>
    </div>
  </header>

  <div class="layout">

    <!-- lista de hábitos -->
    <aside class="sidebar">
      <div class="sidebar-group">
        <h2 class="sidebar-label">Construir</h2>
        <ul id="list-build" class="habit-list"></ul>
      </div>
      <div class="sidebar-group">
        <h2 class="sidebar-label">Abandonar</h2>
        <ul id="list-quit" class="habit-list"></ul>
      </div>
      <p id="empty-habits" class="empty-hint is-hidden">Nenhum hábito ainda.<br>Toque em <strong>+ Hábito</strong> para começar seu caderno.</p>
    </aside>

    <!-- painel do hábito selecionado -->
    <main class="panel">
      <div id="panel-empty" class="panel-empty">
        <span class="panel-empty-mark">§</span>
        <p>Escolha um hábito ao lado<br>ou crie um novo para começar a marcar os dias.</p>
      </div>

      <div id="panel-habit" class="panel-habit is-hidden">
        <div class="habit-header">
          <div class="habit-title-row">
            <span id="habit-icon" class="habit-icon"></span>
            <div>
              <h2 id="habit-name"></h2>
              <p id="habit-meta" class="habit-meta"></p>
            </div>
          </div>
          <div class="habit-header-actions">
            <span id="habit-streak" class="streak-badge"></span>
            <button id="btn-edit-habit" class="icon-btn" title="Editar hábito">✎</button>
          </div>
        </div>

        <nav class="view-tabs">
          <button class="view-tab is-active" data-view="week">Semana</button>
          <button class="view-tab" data-view="month">Mês</button>
          <button class="view-tab" data-view="heatmap">6 meses</button>
        </nav>

        <div id="view-week" class="view-body"></div>
        <div id="view-month" class="view-body is-hidden"></div>
        <div id="view-heatmap" class="view-body is-hidden"></div>
      </div>
    </main>
  </div>
</section>

<!-- ===== MODAL: NOVO/EDITAR HÁBITO ===== -->
<div id="habit-modal" class="modal-overlay is-hidden">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Novo hábito</h3>
      <button id="modal-close" class="icon-btn">×</button>
    </div>

    <form id="habit-form" class="modal-form">
      <label>Nome
        <input type="text" id="field-name" required placeholder="Ex.: Beber água, Ler a Bíblia, Fumar">
      </label>

      <div class="field-row">
        <label class="grow">Ícone
          <input type="text" id="field-icon" maxlength="4" placeholder="✅" required>
        </label>
      </div>
      <div id="icon-picker" class="icon-picker"></div>

      <label>Cor</label>
      <div id="color-picker" class="color-picker"></div>

      <div class="field-row">
        <label class="grow">Objetivo
          <select id="field-goal">
            <option value="build">Construir hábito</option>
            <option value="quit">Abandonar hábito</option>
          </select>
        </label>
        <label class="grow">Marcação
          <select id="field-type">
            <option value="check">Sim / não (diária)</option>
            <option value="count">Quantidade (várias por dia)</option>
          </select>
        </label>
      </div>

      <label id="target-field" class="is-hidden">Meta diária (opcional)
        <input type="number" id="field-target" min="1" placeholder="Ex.: 8 copos">
      </label>

      <div class="modal-actions">
        <button type="button" id="btn-delete-habit" class="btn btn-danger is-hidden">Excluir</button>
        <div class="modal-actions-right">
          <button type="button" id="btn-cancel-habit" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast is-hidden"></div>

<!-- Firebase SDK (modular, via CDN) -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/db.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/calendar.js"></script>
<script type="module" src="js/habits.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
